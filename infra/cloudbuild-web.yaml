# Builds the web app.
#
# NEXT_PUBLIC_* values are compiled into the client bundle, so they are build
# arguments rather than runtime environment. Every one of them is public by
# design: the Firebase browser key identifies the project, it does not
# authorise anything on its own.
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=apps/web/Dockerfile
      - --build-arg=NEXT_PUBLIC_API_BASE_URL=${_API_BASE_URL}
      - --build-arg=NEXT_PUBLIC_FIREBASE_API_KEY=${_FIREBASE_API_KEY}
      - --build-arg=NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${_FIREBASE_AUTH_DOMAIN}
      - --build-arg=NEXT_PUBLIC_FIREBASE_PROJECT_ID=$PROJECT_ID
      - --tag=us-central1-docker.pkg.dev/$PROJECT_ID/preflight/web:${_TAG}
      - .
images:
  - us-central1-docker.pkg.dev/$PROJECT_ID/preflight/web:${_TAG}
substitutions:
  _TAG: v1
  _API_BASE_URL: https://preflight-api-584136898465.us-central1.run.app
# _FIREBASE_API_KEY and _FIREBASE_AUTH_DOMAIN are deliberately not given
# defaults. They used to default to the empty string, which meant a build
# invoked without them succeeded and produced a web app that loaded normally
# and could not sign anyone in - the failure was invisible until someone tried
# to use it. With no default, Cloud Build refuses the build outright, and the
# Dockerfile refuses it again if it is reached another way.
#
# They are not secrets. The browser Firebase config identifies the project and
# authorises nothing, which is why it is passed as a build argument rather than
# read from Secret Manager. It is still not committed here: values come from
# .env, which is not in the repository.
options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
timeout: 1800s
