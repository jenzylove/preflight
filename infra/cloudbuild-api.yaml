# Builds the API image. The Dockerfile lives with the app it builds, and the
# build context is the repository root so the shared contracts package is
# available to both images without vendoring it twice.
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=apps/api/Dockerfile
      - --tag=us-central1-docker.pkg.dev/$PROJECT_ID/preflight/api:$_TAG
      - --tag=us-central1-docker.pkg.dev/$PROJECT_ID/preflight/api:latest
      - .
images:
  - us-central1-docker.pkg.dev/$PROJECT_ID/preflight/api:$_TAG
  - us-central1-docker.pkg.dev/$PROJECT_ID/preflight/api:latest
substitutions:
  _TAG: v1
options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
timeout: 1200s
